<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order placed</title>
<style>
  :root {
    --radius: 8px;
    --ease-spring: linear(0, 0.42 12%, 0.99 31%, 1.09 42%, 1.02 58%, 1);
    --ease-bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
  }
  body { margin: 0; background: #ffffff; color: #1f2937; font-family: system-ui, -apple-system, sans-serif; line-height: 1.5; }
  main { max-width: 40rem; margin: 0 auto; padding: 2rem 1rem; }
  .sheet { border: 1px solid #d1d5db; border-radius: var(--radius); padding: 1rem; }
  .pop { border: 1px solid #d1d5db; border-radius: var(--radius); padding: 0.5rem; }
  .skeleton { width: 240px; height: 16px; border-radius: var(--radius); background: #e5e7eb; }
  .float { display: block; margin: 2rem auto 0; color: #4b5563; }
  @media (prefers-reduced-motion: no-preference) {
    .sheet { transition: transform 360ms var(--ease-spring); }
    .pop { transition: transform 220ms cubic-bezier(0.34, 1.56, 0.64, 1); }
    .skeleton { animation: bounce-soft 1.2s infinite; }
    .float { animation: drift 3s ease-in-out infinite; }
  }
  @keyframes bounce-soft {
    0%, 100% { opacity: .5; transform: scale(.98); }
    50% { opacity: 1; transform: scale(1); }
  }
  @keyframes drift {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .skeleton, .float { animation: none; }
  }
</style>
</head>
<body>
<main>
  <h1>Order placed</h1>
  <div class="sheet" role="status">Your order is on its way. Track it from the orders page.</div>
  <div class="pop">Saved to your list.</div>
  <div class="skeleton" aria-hidden="true"></div>
  <svg class="float" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7" stroke="currentColor" fill="none"/></svg>
</main>
</body>
</html>
