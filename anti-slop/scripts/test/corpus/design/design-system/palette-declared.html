<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fieldnote</title>
<style>
  body { margin: 0; background: oklch(0.98 0.005 280); color: oklch(0.22 0.02 280); font-family: "Söhne", system-ui, sans-serif; line-height: 1.5; }

  <h1>Field notes for the whole team</h1>
