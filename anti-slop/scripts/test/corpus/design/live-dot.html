<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Queue</title>
<style>
  body { margin: 0; background: #ffffff; color: #1f2937; font-family: system-ui, -apple-system, sans-serif; line-height: 1.5; }
  main { max-width: 40rem; margin: 0 auto; padding: 2rem 1rem; }
  .status { display: inline-flex; align-items: center; gap: 0.5rem; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: oklch(0.62 0.17 145); }
  @media (prefers-reduced-motion: no-preference) {
    .live-dot { animation: pulse 1.6s ease-in-out infinite; }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .4; transform: scale(.85); }
  }
  @media (prefers-reduced-motion: reduce) {
    .animate-ping { animation: none; }
  }
</style>
</head>
<body>
<main>
  <h1>Support queue</h1>
  <p class="status"><span class="live-dot" aria-hidden="true"></span> Live</p>
  <p>Four people are waiting. <span class="absolute inline-flex h-2 w-2 rounded-full bg-emerald-500 animate-ping" aria-hidden="true"></span></p>
</main>
</body>
</html>
