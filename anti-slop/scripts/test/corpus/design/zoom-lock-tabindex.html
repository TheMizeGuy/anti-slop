<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Invoice search</title>
</head>
<body>
  <header>
    <a href="/">Ledger</a>
  </header>

  <main>
    <h1>Search invoices</h1>

    <form action="/invoices" method="get">
      <label for="q">Invoice number or customer</label>
      <input id="q" name="q" type="search" tabindex="3">

      <label for="from">Issued after</label>
      <input id="from" name="from" type="date" tabindex="1">

      <label for="to">Issued before</label>
      <input id="to" name="to" type="date" tabindex="2">

      <button type="submit" tabindex="4">Search</button>
    </form>

    <p>Results are limited to the last 24 months. Older invoices are in the archive export.</p>
  </main>
</body>
</html>
