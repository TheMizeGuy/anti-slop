<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launch week</title>
<style>
  body { margin: 0; background: #ffffff; color: #1f2937; font-family: system-ui, -apple-system, sans-serif; line-height: 1.5; }
  main { max-width: 40rem; margin: 0 auto; padding: 2rem 1rem; }
  .ruled { background-image: linear-gradient(oklch(0.92 0 0) 1px, transparent 1px); background-size: 100% 32px; line-height: 32px; }
  .band { background: repeating-linear-gradient(90deg, oklch(0.96 0.02 80) 0, oklch(0.92 0.02 80) 100%); padding: 1rem; }
  .hero { background: linear-gradient(180deg, oklch(0.97 0.01 80), oklch(0.93 0.02 80)); padding: 2rem 1rem; }
</style>
</head>
<body>
<main>
  <section class="hero">
    <h1>Launch week</h1>
    <p>Five releases, one each morning.</p>
  </section>
  <div class="ruled">
    <p>Monday: exports keep your column order.</p>
  </div>
  <div class="band"><p>Tuesday: filters survive a reload.</p></div>
</main>
</body>
</html>
